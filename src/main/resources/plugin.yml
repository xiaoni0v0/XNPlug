name: XNPlug
version: '${version}'

main: me.sl.XNPlug.XNPlug
api-version: '1.21.8'
load: POSTWORLD

commands:
  getip:
    description: 查看玩家 IP 地址
    usage: /getip [玩家名]，若不指定则默认为你自己

permissions:
  xnplug.command.getip:
    description: 允许使用 /getip 命令
    default: op
  xnplug.show_getip:
    description: 可以在其他玩家进入时看到他们的 getip 信息
    default: op
  xnplug.newplayer.message:
    description: 是否已经同意 EULA
    default: false
